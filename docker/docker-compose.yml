services:

  # ---- Streamlit dashboard ----
  xai-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: xai-app
    env_file:
      - ../.env
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b-instruct-q4_K_M
      - DEPLOYMENT_ENV=local
    depends_on:
      - ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G

  # ---- Local LLM server ----
  ollama:
    image: ollama/ollama:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.ollama
    container_name: xai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ../entrypoint.sh:/entrypoint.sh
    restart: unless-stopped
    environment:
      # Keep only 1 model loaded and limit concurrency to save RAM
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      # Unload models after 5 min idle to free RAM for other models
      - OLLAMA_KEEP_ALIVE=5m
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 12G
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # ---- Jenkins CI server (optional — start with: docker compose --profile ci up jenkins) ----
  jenkins:
    build:
      context: ..
      dockerfile: docker/Dockerfile.jenkins
    container_name: xai-jenkins
    profiles: [ "ci" ]
    environment:
      - DOCKER_BUILDKIT=1
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - docker_buildkit_cache:/var/lib/docker/buildkit
    restart: unless-stopped

volumes:
  ollama_data:
  jenkins_data:
  docker_buildkit_cache:
