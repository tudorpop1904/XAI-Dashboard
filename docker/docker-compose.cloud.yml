# ──────────────────────────────────────────────────────────────────────
# docker-compose.cloud.yml — Microsoft Azure Student Plan (x86_64, CPU-only)
#
# Tuned for Azure VM (e.g. Standard_B4ms): 4 vCPUs, 16GB RAM, no GPU.
# Usage:
#   docker compose -f docker/docker-compose.cloud.yml up -d --build
# ──────────────────────────────────────────────────────────────────────

services:

  # ---- Streamlit dashboard ----
  xai-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: xai-app
    env_file:
      - ../.env
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b-instruct-q4_K_M
      - VLM_MODEL=qwen2.5vl:7b-q4_K_M
      - VLM_HOST=http://ollama:11434
      - XAI_SURROGATE_MODEL=minicpm-v
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_API_TOKEN=${KAGGLE_API_TOKEN}
    depends_on:
      - ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G

  # ---- Local LLM server (CPU-only, no NVIDIA) ----
  ollama:
    image: ollama/ollama:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.ollama
    container_name: xai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ../entrypoint.sh:/entrypoint.sh
    restart: unless-stopped
    environment:
      # Only 1 model loaded at a time to fit in 16GB
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      # Unload models after 3 min idle (aggressive to save RAM)
      - OLLAMA_KEEP_ALIVE=3m
      # Force CPU threads to match Azure VM vCPU count
      - OLLAMA_NUM_THREAD=4
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
          # NOTE: No GPU section — Standard Azure Student VM is CPU-only

volumes:
  ollama_data:
